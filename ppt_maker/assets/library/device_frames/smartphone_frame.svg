<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 860" width="100%" height="100%" fill="none">
  <defs>
    <filter id="phone-shadow" x="-20" y="-10" width="460" height="900" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="30" stdDeviation="32" flood-color="#000000" flood-opacity="0.40"/>
    </filter>
  </defs>
  <!-- Outer Chassis -->
  <rect x="15" y="15" width="390" height="830" rx="54" fill="#18191C" stroke="#383A40" stroke-width="4" filter="url(#phone-shadow)"/>
  <!-- Inner Bezel -->
  <rect x="23" y="23" width="374" height="814" rx="46" fill="#0A0A0C" stroke="#1C1D21" stroke-width="2"/>
  <!-- Dynamic Island -->
  <rect x="160" y="38" width="100" height="28" rx="14" fill="#000000" stroke="#1C1D21" stroke-width="1"/>
  <circle cx="244" cy="52" r="5" fill="#0D1117"/>
  <!-- Home Indicator Bar -->
  <rect x="145" y="818" width="130" height="4" rx="2" fill="rgba(255,255,255,0.4)"/>
