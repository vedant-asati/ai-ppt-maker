<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%" fill="none">
  <defs>
    <filter id="browser-shadow" x="-20" y="-10" width="1240" height="840" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Window Body -->
  <rect x="20" y="20" width="1160" height="760" rx="16" fill="var(--surface-card, #131722)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" filter="url(#browser-shadow)"/>
  <!-- Header / Chrome Bar -->
  <path d="M20 36 C20 27.16 27.16 20 36 20 L1164 20 C1172.84 20 1180 27.16 1180 36 L1180 72 L20 72 Z" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Window Control Traffic Lights -->
  <circle cx="52" cy="46" r="6" fill="#FF5F56"/>
  <circle cx="72" cy="46" r="6" fill="#FFBD2E"/>
  <circle cx="92" cy="46" r="6" fill="#27C93F"/>
  <!-- Address Bar Pill -->
  <rect x="180" y="32" width="840" height="28" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <circle cx="200" cy="46" r="3.5" fill="rgba(255,255,255,0.3)"/>
  <rect x="216" y="43" width="120" height="6" rx="3" fill="rgba(255,255,255,0.25)"/>
  <!-- Viewport Clip Area -->
  <rect id="browser-viewport" x="22" y="73" width="1156" height="705" rx="2" fill="transparent"/>
</svg>